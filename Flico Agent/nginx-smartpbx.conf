# Dedicated TLS reverse proxy for the opt-in Dialog SmartPBX service.
# Install only after the operator gates in SMARTPBX_RUNBOOK.md are complete.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    limit_conn_zone $binary_remote_addr zone=smartpbx_per_ip:10m;

    upstream flico_smartpbx {
        server 127.0.0.1:8005;
        keepalive 8;
    }

    server {
        listen 80;
        server_name smartpbx-flico.taskforceai.tech;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name smartpbx-flico.taskforceai.tech;

        # Certificate issuance and DNS are operator gates, not repository state.
        ssl_certificate /etc/letsencrypt/live/smartpbx-flico.taskforceai.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smartpbx-flico.taskforceai.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;

        # Do not write request headers (including the WSS token) to access logs.
        access_log off;
        error_log /var/log/nginx/smartpbx-error.log warn;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        client_max_body_size 64k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 75s;
        limit_conn smartpbx_per_ip 4;

        location = /ws/v1/smartpbx/media {
            proxy_pass http://flico_smartpbx;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /health {
            proxy_pass http://flico_smartpbx;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        location = /smartpbx/status {
            proxy_pass http://flico_smartpbx;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # The service-mode app independently rejects every other route.
        location / {
            return 404;
        }
    }
}

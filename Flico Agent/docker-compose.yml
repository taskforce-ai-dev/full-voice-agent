# ============================================================
# Docker Compose — Flico Voice Agent
# ============================================================
# Runs the production server (server.py) behind Twilio
# ConversationRelay with Claude streaming + ElevenLabs TTS.
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose logs -f flico  # tail logs
#   docker compose down           # stop and remove container
# ============================================================

services:
  flico:
    # -- Build from the Dockerfile in the project root ----------
    # -- Image is built in CI and pulled from GHCR --------------
    # NOT built here. .github/workflows/deploy.yml (mode: image) builds on the
    # GitHub runner and pushes ghcr.io/taskforce-ai-dev/flico:<sha>; the VPS
    # only pulls. Building on the production host is what starved the box on
    # 2026-08-02. See CONTRIBUTING.md §6.
    #
    # IMAGE_TAG is exported by the deploy step and pins this to one immutable
    # SHA tag. To roll back by hand:
    #   IMAGE_TAG=<sha> docker compose pull && IMAGE_TAG=<sha> docker compose up -d
    image: ghcr.io/taskforce-ai-dev/flico:${IMAGE_TAG:-latest}
    container_name: flico-voice-agent

    # -- Networking ---------------------------------------------
    # Twilio webhooks hit port 8000; map host 8003 to container 8000
    # to avoid collision with other services.
    ports:
      - "127.0.0.1:8003:8000"
      - "127.0.0.1:18000-18100:18000-18100/udp"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - taskforceai-net

    # -- Secrets & configuration --------------------------------
    # All API keys (Anthropic, ElevenLabs, Twilio, etc.)
    # are loaded from .env — never baked into the image.
    env_file:
      - .env

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      # -- Knowledge-base backend selector -----------------------
      # sqlite = relational-semantic hybrid (kb/ package): strict SQL
      #          filtering (zone/type/rent/beds) + in-memory MiniLM cosine.
      # chroma = original ChromaDB RAG (knowledge_base_chroma.py).
      # Both backends' files ship in the image and are mounted below, so
      # flipping this value + `docker compose up -d --force-recreate flico`
      # is an instant, no-rebuild rollback either way.
      - KB_BACKEND=sqlite

    # -- Persistent volumes -------------------------------------
    volumes:
      # ChromaDB vector store — kept so a chroma rollback stays instant.
      - ./chroma_db:/app/chroma_db

      # Knowledge documents — source prose the KB is built from; mount as a
      # bind so new/updated docs can be dropped in without rebuilding.
      - ./knowledge_docs:/app/knowledge_docs

      # GCP service account credentials for Google Cloud STT
      - ./full-voice-agent-a8a245fb37cb.json:/app/gcp-credentials.json:ro

      # -- Application code --------------------------------------
      # Bind-mounted so fast-mode deploys (rsync + restart) ship code
      # changes — including the kb/ package — without an image rebuild.
      # The Dockerfile also COPYies these, so the image is self-contained.
      - ./server.py:/app/server.py
      # brands.py MUST be mounted. Fast deploys docker-cp changed .py files into
      # the running container, which works until the container is recreated --
      # then an unmounted file reverts to whatever the image holds, and
      # server.py's `from brands import ...` fails, crash-looping the agent.
      - ./brands.py:/app/brands.py
      # evals/ likewise. `docker exec ... python evals/answer_eval.py` runs the
      # container's copy, so without this mount the eval silently grades against
      # whatever rubric was baked into the image -- which is exactly what
      # happened on 2026-07-31: a regenerated rubric sat on disk while three
      # runs scored the agent against the retired 12-row one.
      - ./evals:/app/evals
      # tests/ too: the eval DERIVES its rubric from tests/truth_table.py (the
      # hand-audited oracle) rather than hardcoding portfolio facts, so the
      # container needs it importable. Without it the eval aborts loudly, which
      # is correct -- a rubric that silently invents its own facts is how the
      # last one went stale.
      - ./tests:/app/tests
      - ./knowledge_base.py:/app/knowledge_base.py
      - ./knowledge_base_chroma.py:/app/knowledge_base_chroma.py
      - ./knowledge_base_sqlite.py:/app/knowledge_base_sqlite.py
      - ./kb:/app/kb
      - ./media_transport.py:/app/media_transport.py
      - ./post_call.py:/app/post_call.py
      - ./asterisk_ari.py:/app/asterisk_ari.py
      - ./asterisk_rtp.py:/app/asterisk_rtp.py

    # -- Restart policy -----------------------------------------
    # Always restart unless explicitly stopped with
    # `docker compose stop` or `docker compose down`.
    restart: unless-stopped

    # -- Logging ------------------------------------------------
    # Cap log size to prevent disk exhaustion on long-running
    # deployments.  3 rotated files x 10 MB each = 30 MB max.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # -- Health check -------------------------------------------
    # Hits the FastAPI /health endpoint every 30 s.
    # The container is marked unhealthy after 3 consecutive
    # failures (retries) with a 10 s timeout per probe.
    # start_period gives the app 40 s to boot (model warm-up,
    # ChromaDB init, etc.) before checks count as failures.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  flico-smartpbx:
    profiles: ["smartpbx"]
    image: ghcr.io/taskforce-ai-dev/flico:${IMAGE_TAG:?IMAGE_TAG must be an immutable SHA}
    container_name: flico-smartpbx

    ports:
      - "127.0.0.1:8005:8000"

    # Do not use env_file here: it would inject legacy Asterisk settings.
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-credentials.json
      KB_BACKEND: sqlite
      FLICO_SERVICE_MODE: smartpbx
      ENABLE_ASTERISK_ARI: "false"
      ENABLE_SMARTPBX_WSS: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_VOICE_SPEED: ${ELEVENLABS_VOICE_SPEED:-1.0}
      SMARTPBX_WS_TOKEN: ${SMARTPBX_WS_TOKEN:-}
      SMARTPBX_ACCOUNT_ID: ${SMARTPBX_ACCOUNT_ID:-}
      SMARTPBX_MAX_CALLS: ${SMARTPBX_MAX_CALLS:-4}
      SMARTPBX_MAX_MESSAGE_CHARS: ${SMARTPBX_MAX_MESSAGE_CHARS:-65536}
      SMARTPBX_MAX_AUDIO_BYTES: ${SMARTPBX_MAX_AUDIO_BYTES:-32768}
      SMARTPBX_MAX_OUTBOUND_FRAMES: ${SMARTPBX_MAX_OUTBOUND_FRAMES:-128}
      SMARTPBX_START_TIMEOUT_SECONDS: ${SMARTPBX_START_TIMEOUT_SECONDS:-10}
      SMARTPBX_IDLE_TIMEOUT_SECONDS: ${SMARTPBX_IDLE_TIMEOUT_SECONDS:-90}
      SMARTPBX_MCP_URL: ${SMARTPBX_MCP_URL:-https://dialog.cybergate.lk:9443/ucp/v2/mcp}
      SMARTPBX_API_KEY: ${SMARTPBX_API_KEY:-}
      SMARTPBX_TRANSFER_DESTINATIONS_JSON: ${SMARTPBX_TRANSFER_DESTINATIONS_JSON:-{}}
      SMARTPBX_MCP_ACCOUNT_HEADER: ${SMARTPBX_MCP_ACCOUNT_HEADER:-}
      SMARTPBX_MCP_CONNECT_TIMEOUT_SECONDS: ${SMARTPBX_MCP_CONNECT_TIMEOUT_SECONDS:-3}
      SMARTPBX_MCP_READ_TIMEOUT_SECONDS: ${SMARTPBX_MCP_READ_TIMEOUT_SECONDS:-8}
      SMARTPBX_MCP_RETRIES: ${SMARTPBX_MCP_RETRIES:-1}

    volumes:
      - ./full-voice-agent-a8a245fb37cb.json:/app/gcp-credentials.json:ro
      - ./server.py:/app/server.py:ro
      - ./brands.py:/app/brands.py:ro
      - ./knowledge_docs:/app/knowledge_docs:ro
      - ./knowledge_base.py:/app/knowledge_base.py:ro
      - ./knowledge_base_chroma.py:/app/knowledge_base_chroma.py:ro
      - ./knowledge_base_sqlite.py:/app/knowledge_base_sqlite.py:ro
      - ./kb:/app/kb:ro
      - ./media_transport.py:/app/media_transport.py:ro
      - ./post_call.py:/app/post_call.py:ro
      - ./smartpbx_gateway.py:/app/smartpbx_gateway.py:ro
      - ./smartpbx_mcp.py:/app/smartpbx_mcp.py:ro
      - ./smartpbx_protocol.py:/app/smartpbx_protocol.py:ro
      - ./smartpbx_transport.py:/app/smartpbx_transport.py:ro

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  taskforceai-net:
    external: true

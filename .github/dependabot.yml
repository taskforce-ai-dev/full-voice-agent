# Dependabot configuration for the Full Voice Agent monorepo.
# Weekly update checks for Python (pip) per agent directory, the npm
# dashboard, and GitHub Actions workflows. Each ecosystem caps open PRs at 5
# and tags commit messages with a per-ecosystem prefix.
# NOTE: Dependabot must also be enabled in repo Settings -> Code security
# (security & analysis) for these update jobs to run.
version: 2
updates:
  # ---- Python agents (pip) ----
  - package-ecosystem: "pip"
    directory: "/BSL Agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(pip)"
    ignore:
      # numpy/scipy 2.5.x / 1.18.x require Python >=3.12; images are 3.11-slim.
      # Remove these two when the base image moves — see the note at the bottom.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
      - dependency-name: "scipy"
        versions: [">=1.18.0"]
      # google-genai requires websockets<17.0 and every agent pins google-genai.
      - dependency-name: "websockets"
        versions: [">=17.0"]
      # transformers 5.14.1 requires tokenizers<=0.23.0.
      - dependency-name: "tokenizers"
        versions: [">0.23.0"]
      # Transitive only: pydantic pins pydantic-core to an exact version, so a
      # standalone bump can never resolve. Bumping pydantic brings it along.
      - dependency-name: "pydantic-core"

  - package-ecosystem: "pip"
    directory: "/Flico Agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

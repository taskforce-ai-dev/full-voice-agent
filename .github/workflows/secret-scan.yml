name: secret-scan

# Scan every push and every pull request for leaked secrets.
# Fails the build if gitleaks detects a secret, so a leak (like the
# Twilio Auth Token previously committed to BSL Agent/.env.example)
# can never land silently again.
#
# This invokes the open-source gitleaks BINARY directly instead of
# gitleaks/gitleaks-action, because the action requires a paid
# GITLEAKS_LICENSE for organization-owned repos (this repo moved from
# the personal account thiva2k to the taskforce-ai-dev org in Aug 2026).
# The binary itself is MIT-licensed and free for any use.
#
# Scan scope:
#   - pull_request:              only the PR's commits (fast, focused)
#   - push to a feature branch:  only the pushed commits
#   - push to main, weekly cron,
#     manual dispatch:           FULL git history (catches anything missed)

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-history sweep (Mondays 06:00 UTC) to catch anything missed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # Pin the exact release + its sha256 (from the official
  # gitleaks_8.30.1_checksums.txt) so the scan is reproducible and a
  # compromised release asset cannot slip in silently.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan commit ranges and, on
          # main/schedule, every commit — not just the tip.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          # pull_request: scan exactly the commits the PR introduces.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # push: scan exactly the commits in the push.
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # gitleaks exits 1 when a leak is found, which fails this job.
          # --redact keeps secret values out of the CI logs.
          common_args=(git . --config .gitleaks.toml --redact --verbose --exit-code 1 --no-banner)

          case "$EVENT_NAME" in
            pull_request)
              echo "Scanning PR commits: ${PR_BASE_SHA}..${PR_HEAD_SHA}"
              gitleaks "${common_args[@]}" \
                --log-opts="--no-merges ${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              if [ "$REF_NAME" = "${DEFAULT_BRANCH:-main}" ]; then
                echo "Push to ${REF_NAME}: scanning FULL history"
                gitleaks "${common_args[@]}"
              elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
                   || ! git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
                # New branch (or unknown base after a force-push): scan every
                # commit not already on the default branch.
                echo "New branch ${REF_NAME}: scanning origin/${DEFAULT_BRANCH:-main}..HEAD"
                gitleaks "${common_args[@]}" \
                  --log-opts="--no-merges origin/${DEFAULT_BRANCH:-main}..HEAD"
              else
                echo "Push to ${REF_NAME}: scanning ${PUSH_BEFORE}..${PUSH_AFTER}"
                gitleaks "${common_args[@]}" \
                  --log-opts="--no-merges ${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *)
              # schedule / workflow_dispatch: full-history sweep.
              echo "${EVENT_NAME}: scanning FULL history"
              gitleaks "${common_args[@]}"
              ;;
          esac

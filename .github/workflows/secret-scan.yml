name: secret-scan

# Scan every push and every pull request for leaked secrets.
# Fails the build if gitleaks detects a secret, so a leak (like the
# Twilio Auth Token previously committed to BSL Agent/.env.example)
# can never land silently again.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-history sweep (Mondays 06:00 UTC) to catch anything missed.
    - cron: '0 6 * * 1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config lives at the repo root (.gitleaks.toml) and is auto-detected.
          # NOTE: A paid GITLEAKS_LICENSE is only required for repos owned by a
          # GitHub *organization*. This is a private repo owned by an individual,
          # so no license is needed. If you ever move it under an org and see an
          # "organization license" error, either set GITLEAKS_LICENSE here, or
          # delete the step above and use the binary-based fallback below.

      # ---------------------------------------------------------------------
      # Fallback: run gitleaks directly via its binary (no action, no license).
      # Uncomment this and delete the "Run gitleaks" action step above if the
      # org-license error ever blocks the official action.
      #
      # - name: Run gitleaks (binary fallback)
      #   run: |
      #     VERSION=8.18.4
      #     curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
      #       | tar -xz -C /usr/local/bin gitleaks
      #     gitleaks detect \
      #       --source . \
      #       --config .gitleaks.toml \
      #       --redact \
      #       --verbose \
      #       --exit-code 1
      # ---------------------------------------------------------------------

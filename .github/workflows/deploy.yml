# ============================================================================
# Continuous Deployment — full-voice-agent monorepo  (SMART DEPLOY ENGINE)
# ----------------------------------------------------------------------------
# Touches PRODUCTION (DigitalOcean VPS 67.207.90.109). Two ways to run it:
#   • workflow_call      — invoked automatically by deploy-on-push.yml for each
#                          agent changed in a push to main (mode auto-chosen).
#   • workflow_dispatch  — manual: pick the agent + ref + mode from the Actions
#                          tab (for redeploys / rollbacks without a code change).
# The human gate is the in-session risk analysis + approval BEFORE the push;
# there is no separate approval step in GitHub.
#
# MODE:
#   fast  — rsync the agent's source to /opt/<dir>, hot-swap the changed .py
#           files into the running container (docker cp) and `docker restart`.
#           No image rebuild. ~seconds. Use for code / knowledge-doc edits.
#   build — rsync + `docker compose up -d --build`. Use ONLY when
#           requirements*.txt / Dockerfile / docker-compose.yml changed.
#
# A deploy briefly interrupts in-flight calls on THAT agent (fast = a quick
# restart; build = longer). .env and runtime state on the VPS are never touched
# (rsync excludes them). Prereqs: repo secrets VPS_HOST, VPS_USER, VPS_SSH_KEY.
# ============================================================================

name: Deploy Agent

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent to deploy"
        required: true
        type: choice
        options: [bsl, flico, hatton, slic, sofia, kavya, kitchened, wor]
      ref:
        description: "Git ref / tag / commit to deploy"
        required: true
        type: string
        default: "main"
      mode:
        description: "image (build on runner, pull on VPS) | fast (hot-swap) | build (legacy: rebuild ON the VPS)"
        required: true
        type: choice
        options: [image, fast, build]
        default: image
  workflow_call:
    inputs:
      agent: { required: true, type: string }
      ref:   { required: true, type: string }
      mode:  { required: true, type: string }
    secrets:
      VPS_HOST: { required: true }
      VPS_USER: { required: true }
      VPS_SSH_KEY: { required: true }

concurrency:
  group: deploy-vps-${{ inputs.agent }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.agent }} (${{ inputs.mode }})
    runs-on: ubuntu-latest
    # packages:write is needed only by `image` mode, to push to GHCR. contents:read
    # is the checkout. Nothing here needs more.
    permissions:
      contents: read
      packages: write
    env:
      AGENT: ${{ inputs.agent }}
      REF: ${{ inputs.ref }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout at ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Reject Kavya generic deployment
        run: |
          set -euo pipefail
          if [[ "$AGENT" == "kavya" ]]; then
            echo "Kavya is excluded from generic deploy.yml for every mode (image, fast, build); use the build-only Kavya image publisher and the guarded runbook script (scripts/deploy_smartpbx_image.sh)." >&2
            exit 1
          fi

      - name: Resolve agent -> source dir / VPS path / container
        id: map
        run: |
          case "$AGENT" in
            bsl)       SRC="BSL Agent";            OPT="/opt/bsl-agent";            CON="bsl-agent" ;;
            flico)     SRC="Flico Agent";          OPT="/opt/flico";                CON="flico-voice-agent" ;;
            hatton)    SRC="HattonHills";          OPT="/opt/hatton-hills";         CON="hatton-hills-voice-agent" ;;
            slic)      SRC="SLIC Agent";           OPT="/opt/slic-agent";           CON="slic-voice-agent" ;;
            sofia)     SRC="Sofia Agent";          OPT="/opt/sofia";                CON="sofia-voice-agent" ;;
            kavya)     SRC="Kavya";                OPT="/opt/kavya";                CON="kavya-voice-agent" ;;
            kitchened) SRC="Kitchened";            OPT="/opt/kitchened";            CON="kitchened-voice-agent" ;;
            wor)       SRC="WorldOfRefrigerators"; OPT="/opt/worldofrefrigerators"; CON="wor-voice-agent" ;;
            *) echo "Unknown agent id: $AGENT" >&2; exit 1 ;;
          esac
          { echo "src=$SRC"; echo "opt=$OPT"; echo "con=$CON"; } >> "$GITHUB_OUTPUT"
          echo "Deploy '$AGENT' [$SRC] -> $OPT (container $CON) @ $REF  mode=$MODE"

      # ---------------------------------------------------------------------
      # IMAGE mode: build on the RUNNER, never on the VPS.
      #
      # Building on the production host means pip + docker compete with the
      # containers answering calls. On 2026-08-02 eight concurrent builds
      # starved the box and killed the SSH sessions mid-export, failing 3 of 8
      # deploys. Building here removes that failure class entirely; the VPS only
      # pulls.
      #
      # Tagged by commit SHA so a rollback pulls the exact image that ran,
      # rather than rebuilding from a ref and hoping it resolves the same.
      # ---------------------------------------------------------------------
      - name: Set up Buildx
        if: ${{ inputs.mode == 'image' }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.mode == 'image' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        if: ${{ inputs.mode == 'image' }}
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # GHCR requires a lowercase namespace; the org is already lowercase but
          # do not depend on that.
          repo="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/${AGENT}"
          sha="$(git rev-parse --short HEAD)"
          { echo "repo=$repo"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          echo "Image: $repo:$sha (also tagged :latest)"

      - name: Build & push image
        if: ${{ inputs.mode == 'image' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.map.outputs.src }}
          file: ${{ steps.map.outputs.src }}/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ steps.img.outputs.sha }}
            ${{ steps.img.outputs.repo }}:latest
          # Links the package to this repo so GITHUB_TOKEN can pull it and the
          # package page points somewhere useful.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.agent }}
          cache-to: type=gha,scope=${{ inputs.agent }},mode=max

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync agent files to the VPS (preserves .env + runtime state)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SRC: ${{ steps.map.outputs.src }}
          OPT: ${{ steps.map.outputs.opt }}
        run: |
          # Kavya is rejected above for every mode, so this branch never runs
          # for it today. These extra excludes are defence in depth only: if
          # the reject step above is ever loosened or removed by mistake, a
          # kavya rsync still cannot overwrite the host-side control plane
          # (compose env allowlist, nginx vhosts, the guarded deploy scripts,
          # the runbook). Other agents are unaffected.
          extra_excludes=()
          if [[ "$AGENT" == "kavya" ]]; then
            extra_excludes=(
              --exclude='scripts/' --exclude='docker-compose.yml'
              --exclude='nginx-smartpbx*.conf' --exclude='SMARTPBX_RUNBOOK.md'
            )
          fi
          rsync -az \
            --exclude='.env' --exclude='.env.*' \
            --exclude='.git/' --exclude='.github/' \
            --exclude='venv/' --exclude='.venv/' --exclude='__pycache__/' \
            --exclude='chroma_db/' --exclude='node_modules/' \
            --exclude='*.log' --exclude='active_sessions.json' --exclude='*.bak' \
            "${extra_excludes[@]}" \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            "$SRC/" "$VPS_USER@$VPS_HOST:$OPT/"

      - name: Apply — FAST (hot-swap code + restart, no rebuild)
        if: ${{ inputs.mode == 'fast' }}
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          OPT: ${{ steps.map.outputs.opt }}
          CON: ${{ steps.map.outputs.con }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
          set -e
          # Hot-swap every top-level .py into the running container, then restart.
          # Works whether the compose bind-mounts code or bakes it into the image.
          # Bind-mounted files (e.g. server.py, knowledge_base.py) cannot be — and
          # need not be — docker-cp'd: the mount already reflects the rsync'd change
          # and the restart re-resolves it. So a failed cp is skipped, not fatal
          # (previously an unlinkat "device or resource busy" aborted the whole deploy).
          for f in "$OPT"/*.py; do
            [ -f "\$f" ] || continue
            docker cp "\$f" "$CON:/app/\$(basename "\$f")" 2>/dev/null \
              || echo "  skip hot-swap (bind-mounted or busy): \$(basename "\$f")"
          done
          docker restart "$CON"
          REMOTE

      - name: Apply — BUILD (rebuild image + restart)
        if: ${{ inputs.mode == 'build' }}
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          OPT: ${{ steps.map.outputs.opt }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "set -e; cd \"$OPT\"; docker compose up -d --build; docker compose ps"

      - name: Apply — IMAGE (pull + restart, no build on the VPS)
        if: ${{ inputs.mode == 'image' }}
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          OPT: ${{ steps.map.outputs.opt }}
          REPO_IMG: ${{ steps.img.outputs.repo }}
          IMG_SHA: ${{ steps.img.outputs.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token travels over stdin via the heredoc, never argv, so it does
          # not show up in the remote process list.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
          set -euo pipefail
          printf '%s' '$GH_TOKEN' | docker login ghcr.io -u '$GH_ACTOR' --password-stdin
          cd "$OPT"
          # compose resolves \${IMAGE_TAG} in the image: line. Shell env beats the
          # .env file, so this pins the deploy to one immutable SHA tag.
          export IMAGE_TAG='$IMG_SHA'
          docker compose pull
          docker compose up -d
          docker compose ps
          docker logout ghcr.io >/dev/null 2>&1 || true
          # Reclaim the image this deploy replaced. This box has a history of
          # disk exhaustion — see the CPU-only-torch note in the Dockerfiles —
          # and pulling without pruning is exactly how it fills up.
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE
          echo "Deployed $REPO_IMG:$IMG_SHA"

      - name: Health check
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CON: ${{ steps.map.outputs.con }}
        run: |
          sleep 5
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "docker ps --filter name=\"$CON\" --format '{{.Names}}  {{.Status}}'"

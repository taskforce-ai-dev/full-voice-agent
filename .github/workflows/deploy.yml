# ============================================================================
# Continuous Deployment — full-voice-agent monorepo
# ----------------------------------------------------------------------------
# MANUAL-TRIGGER BY DESIGN. Touches PRODUCTION (DigitalOcean VPS 67.207.90.109).
# You start a deploy from the Actions tab (or `gh workflow run`) and pick which
# agent + which git ref/tag to roll out.
#
# MODEL: the runner checks out this repo at <ref>, then RSYNCS the chosen
# agent's source folder to its /opt/<dir> on the VPS (EXCLUDING .env and runtime
# state — those stay on the box), then rebuilds + restarts that agent's
# container. The VPS does NOT need git access; the runner is the source of truth.
#
# PREREQUISITES (already wired — see docs/DEPLOYMENT.md):
#   Repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY  (set + validated)
#
# NOTE: `docker compose up -d --build` rebuilds the image, so a deploy restarts
# the container and briefly interrupts any in-flight call on THAT agent. Deploy
# during a quiet window. .env on the VPS is never touched (rsync excludes it).
# ============================================================================

name: Deploy Agent (manual)

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent to deploy"
        required: true
        type: choice
        options:
          - bsl
          - flico
          - hatton
          - slic
          - sofia
          - kavya
          - kitchened
          - wor
      ref:
        description: "Git ref / tag / commit to deploy (e.g. main, flico-v1.0.0)"
        required: true
        type: string
        default: "main"

  # Pushing a per-agent tag (e.g. bsl-v1.0.0) only prints a reminder — it does
  # NOT auto-deploy. Production deploys stay manual.
  push:
    tags:
      - "*-v*"

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      AGENT: ${{ inputs.agent }}
      REF: ${{ inputs.ref }}
    steps:
      - name: Checkout repo at the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve agent -> source dir / VPS path / container
        id: map
        run: |
          # Mapping verified against the live VPS (ls -d /opt/*/ + docker ps).
          case "$AGENT" in
            bsl)       SRC="BSL Agent";            OPT="/opt/bsl-agent";            CON="bsl-agent" ;;
            flico)     SRC="Flico Agent";          OPT="/opt/flico";                CON="flico-voice-agent" ;;
            hatton)    SRC="HattonHills";          OPT="/opt/hatton-hills";         CON="hatton-hills-voice-agent" ;;
            slic)      SRC="SLIC Agent";           OPT="/opt/slic-agent";           CON="slic-voice-agent" ;;
            sofia)     SRC="Sofia Agent";          OPT="/opt/sofia";                CON="sofia-voice-agent" ;;
            kavya)     SRC="Kavya";                OPT="/opt/kavya";                CON="kavya-voice-agent" ;;
            kitchened) SRC="Kitchened";            OPT="/opt/kitchened";            CON="kitchened-voice-agent" ;;
            wor)       SRC="WorldOfRefrigerators"; OPT="/opt/worldofrefrigerators"; CON="wor-voice-agent" ;;
            *) echo "Unknown agent id: $AGENT" >&2; exit 1 ;;
          esac
          { echo "src=$SRC"; echo "opt=$OPT"; echo "con=$CON"; } >> "$GITHUB_OUTPUT"
          echo "Deploy '$AGENT'  [$SRC] -> $OPT  (container $CON)  @ $REF"

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync agent files to the VPS (preserves .env + runtime state)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SRC: ${{ steps.map.outputs.src }}
          OPT: ${{ steps.map.outputs.opt }}
        run: |
          # No --delete: we overlay files and never remove VPS-only state.
          # .env / runtime json / caches / venvs are excluded so live config and
          # session state on the box are untouched.
          rsync -az \
            --exclude='.env' --exclude='.env.*' \
            --exclude='.git/' --exclude='.github/' \
            --exclude='venv/' --exclude='.venv/' --exclude='__pycache__/' \
            --exclude='chroma_db/' --exclude='node_modules/' \
            --exclude='*.log' --exclude='active_sessions.json' --exclude='*.bak' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            "$SRC/" "$VPS_USER@$VPS_HOST:$OPT/"

      - name: Rebuild + restart the container
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          OPT: ${{ steps.map.outputs.opt }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "set -e; cd \"$OPT\"; docker compose up -d --build; docker compose ps"

      - name: Health check
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CON: ${{ steps.map.outputs.con }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "docker ps --filter name=\"$CON\" --format '{{.Names}}  {{.Status}}'"

  tag-reminder:
    name: Tag push (no auto-deploy)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Explain that tag pushes do not auto-deploy
        run: |
          echo "Tag ${{ github.ref_name }} was pushed. Production deploys are MANUAL by design."
          echo "Run it explicitly, e.g.:"
          echo "  gh workflow run deploy.yml -f agent=<id> -f ref=${{ github.ref_name }}"

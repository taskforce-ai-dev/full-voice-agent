# ---------------------------------------------------------------------------
# CI for the Full Voice Agent monorepo (PRIVATE)
#
# Strategy
# --------
# This repo holds 8+ Python 3.11 / FastAPI voice agents in sibling folders,
# several of which contain SPACES in their names ("BSL Agent", "Flico Agent",
# "SLIC Agent", "Sofia Agent"). Heavy ML deps (torch/CUDA, TTS stacks) make a
# full `pip install -r requirements-prod.txt` for every agent slow and flaky,
# so CI is deliberately split into fast, independent, parallel jobs and AVOIDS
# installing full project dependencies wherever possible:
#
#   * lint          - ruff over the whole tree (needs NO project deps).
#                     ADVISORY by policy (CONTRIBUTING.md §1): reports, never
#                     fails. See the job comment for the tightening path.
#   * docs-drift    - re-runs ops/sync-agent-docs.sh and fails if any
#                     */AGENTS.md is out of sync with its CLAUDE.md.
#   * dockerfile-lint - hadolint over every agent Dockerfile (ADVISORY: only
#                     `error`-level findings fail the build).
#   * test          - matrix over ONLY agents that actually ship tests.
#                     Dependency INSTALL stays best-effort (an infra/network
#                     flake pulling in heavy ML deps is not a test failure),
#                     but BLOCKING as of 2026-08-06: once deps install, a
#                     failing test fails the run. See the job comment.
#   * deps-resolve  - dry-run resolves every requirements-prod.lock.txt on a
#                     real Python 3.11. BLOCKING, and deliberately so: it is
#                     the only job that touches the file the images actually
#                     install. See its comment for the five merged-but-
#                     unbuildable bumps that motivated it.
#
# IMPORTANT: folder names contain spaces. They are always double-quoted in
# shell and passed as quoted JSON strings in the matrix.
#
# NOTE ON LENIENCY (tightened 2026-08-06): the `test` job started lenient
# (continue-on-error, plus a `pytest || echo ... lenient mode` fallback) on
# purpose so CI landed reliably green while coverage was thin. Coverage has
# since grown — Kavya alone collects 230+ tests, including the 36 handoff-
# intercept tests that encode a real fixed production bug, and the
# prompt-policy tests that lock the name-recovery rules whose breakage once
# produced a wrong booking (issue #117). A safety net that cannot fail the
# build is decoration, so both fallbacks are gone: a failing test now blocks
# the run. Dependency INSTALL remains best-effort on purpose — see the job
# comment below for why that line stays lenient while the test step doesn't.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Lint — ruff only, no project dependencies required.
  # -------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    # ADVISORY BY POLICY (CONTRIBUTING.md §1): this codebase predates ruff, so a
    # full-tree `ruff check .` reports ~1,000 pre-existing violations across
    # every agent folder. They cannot be mass-fixed safely — reformatting agent
    # .py files on main hot-swaps every production voice agent at once (see
    # deploy-on-push.yml). Blocking on them keeps CI permanently red, which
    # trains people to ignore CI.
    #
    # The previous job-level `continue-on-error: true` was NOT enough: GitHub
    # still renders the failed job as a red X on the run and on PR checks, so
    # the pipeline *looked* broken on every run even when nothing was wrong.
    # Now the ruff step itself always exits 0 and publishes the full report to
    # the job log + step summary, so red in this workflow always means a REAL
    # failure elsewhere.
    #
    # Tightening path (in order, as debt is paid down during quiet windows):
    #   1. per-folder cleanup PRs (one agent at a time, quiet-window merges),
    #   2. then replace `exit 0` below with `exit "$status"`,
    #   3. then promote `lint` to a required check.
    # continue-on-error stays as a belt-and-braces so an infra flake in this
    # advisory job (pip/network) can never redden the run either.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned so the advisory violation count only moves when the code (or a
        # deliberate bump) changes, not whenever ruff releases new rules.
        run: pip install "ruff==0.16.1"

      - name: Run ruff (advisory — reports, never blocks; CONTRIBUTING.md §1)
        run: |
          set +e
          ruff check . --output-format concise
          status=$?
          {
            echo "## ruff (advisory — does not block merges)"
            if [ "$status" -eq 0 ]; then
              echo ""
              echo "No violations. Consider starting the tightening path in ci.yml."
            else
              echo ""
              echo "Pre-existing violations, grandfathered per CONTRIBUTING.md §1."
              echo "Do not mass-fix: reformatting agent folders auto-deploys to prod."
              echo ""
              echo '```'
              ruff check . --statistics 2>/dev/null
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # -------------------------------------------------------------------------
  # 2. Docs drift — AGENTS.md must mirror CLAUDE.md.
  # -------------------------------------------------------------------------
  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Re-sync AGENTS.md mirrors
        run: bash ops/sync-agent-docs.sh

      - name: Fail if any AGENTS.md is out of sync
        run: git diff --exit-code -- '*/AGENTS.md'

  # -------------------------------------------------------------------------
  # 3. Dockerfile lint — hadolint, ADVISORY (only error-level fails build).
  #    Single looping step handles spaced folder names via quoted "$f".
  # -------------------------------------------------------------------------
  dockerfile-lint:
    name: dockerfile-lint
    runs-on: ubuntu-latest
    # Advisory: surfaces Dockerfile issues but must not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Lint every agent Dockerfile (advisory)
        run: |
          status=0
          shopt -s nullglob
          for f in */Dockerfile; do
            echo "::group::hadolint $f"
            # Treat hadolint as advisory: only error-level findings fail.
            hadolint --failure-threshold error "$f" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # -------------------------------------------------------------------------
  # 4. Test — matrix over ONLY agents that ship tests.
  #
  #    BLOCKING as of 2026-08-06 (see header note for why). A failing test
  #    now fails this job and the run. Dependency INSTALL stays best-effort
  #    on purpose: heavy ML deps (torch, sentence-transformers) can fail to
  #    install on an infra/network flake, and that is a different failure
  #    mode than a test actually failing — conflating them would make a red
  #    run here mean "something in PyPI/network hiccuped" as often as it
  #    means "a test caught a real regression," which is exactly the kind of
  #    noise that trains people to stop reading this job. If install ever
  #    needs to be made strict too, expect infra flakiness and be ready to
  #    defend it (per the task this change shipped from).
  #
  #    Spaced folder names are passed as quoted JSON strings and double-quoted
  #    in every shell command below.
  # -------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only agents that currently contain tests (tests/ dir or test_*.py).
        # Add more here as agents gain test suites.
        agent:
          - "Kavya"
          - "HattonHills"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Detect tests in "${{ matrix.agent }}"
        id: detect
        run: |
          dir="${{ matrix.agent }}"
          if [ -d "$dir/tests" ] || \
             ls "$dir"/test_*.py "$dir"/*_test.py >/dev/null 2>&1; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No tests found in \"$dir\" — skipping."
          fi

      - name: Install dependencies (best-effort) + pytest
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          dir="${{ matrix.agent }}"
          python -m pip install --upgrade pip
          # Best-effort and deliberately still lenient (see job comment):
          # heavy deps (torch/CUDA) failing to install is an infra flake, not
          # a test result. If this ever fails, pytest collection below will
          # simply error on the missing imports — that failure is real and
          # DOES block, same as any other; only the install step itself
          # stays non-fatal.
          if [ -f "$dir/requirements-prod.txt" ]; then
            pip install -r "$dir/requirements-prod.txt" || \
              echo "Full deps for \"$dir\" failed to install — continuing lenient."
          fi
          # pytest-asyncio is required for Kavya's async tests (yanolja
          # availability/booking, handoff-intercept). It lives in Kavya's
          # requirements.txt (local-dev deps), not requirements-prod.txt, so
          # it must be installed explicitly here — without it those tests
          # don't get skipped, they FAIL ("async def functions are not
          # natively supported"), which is silent today only because this
          # job used to swallow every test failure regardless of cause.
          pip install "pytest>=9.1.1" "pytest-asyncio>=1.4.0"

      - name: Run pytest in "${{ matrix.agent }}"
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          dir="${{ matrix.agent }}"
          cd "$dir"
          # Scoped to tests/, NOT bare `pytest`. Both agents also carry
          # manual/live scripts at the top level whose names collide with
          # pytest's default discovery (test_voice.py, test_dashboard_client.py)
          # - neither contains a single `def test_*`.
          #
          # This scoping was proven load-bearing, not cosmetic, by two
          # now-deleted Kavya scripts: ops/mosvold-pms/live_conversation_test.py
          # and live_smoke_test.py (Mosvold-era, pointed at the retired
          # treehouse.taskforceai.tech host). live_conversation_test.py ran
          # asyncio.run(main()) at MODULE level, opening a real WebSocket to
          # production the instant pytest imported it. Verified live before
          # #204 merged: bare `pytest --collect-only` in Kavya/ does not fail
          # cleanly on that file, it HANGS - confirmed by manually killing it
          # after 120s. On a blocking job that would have burned the job
          # timeout on every single run while hitting production from CI, not
          # gone red. Bare `pytest` was only ever "working" here because
          # continue-on-error and the `|| echo` fallback below swallowed a
          # hang exactly as readily as a real test failure.
          pytest tests

      - name: Build and import Kavya image
        if: matrix.agent == 'Kavya'
        working-directory: Kavya
        run: |
          image="kavya-english-voice-profile-ci"
          docker build -t "$image" .
          docker run --rm --entrypoint python "$image" -c "import english_voice_profile; import server"

  # ---------------------------------------------------------------------------
  # 5. deps-resolve — can each agent's production lock actually be installed?
  #
  #    WHY THIS EXISTS: on 2026-08-05 five Dependabot bumps were merged with
  #    fully green checks and left `main` unbuildable for four agents:
  #
  #      numpy 2.5.1        Requires-Python >=3.12  (images are python:3.11-slim)
  #      scipy 1.18.0       Requires-Python >=3.12
  #      websockets 17.0.1  google-genai requires <17.0
  #      pydantic-core 2.47.0  pydantic pins it EXACTLY
  #      tokenizers 0.23.1  transformers requires <=0.23.0
  #
  #    Nothing above is exotic — every one is visible to the resolver in
  #    seconds. They passed because NO job in this file installs
  #    requirements-prod.lock.txt: `test` installs each agent's plain
  #    requirements-prod.txt (unpinned, best-effort — see its own comment),
  #    never the .lock file, and nothing builds the Docker image. A lock file
  #    could therefore be merged in a state where no agent could deploy, and
  #    the failure surfaced later at deploy time with no obvious link back.
  #
  #    Running on a real 3.11 interpreter is load-bearing. A resolve on 3.12
  #    accepts both the numpy and scipy pins happily; they only fail inside the
  #    image. Two of the five were exactly that class, so this job MUST keep
  #    python-version pinned to whatever the Dockerfiles use.
  #
  #    Deliberately NOT using pip's --python-version flag: it requires
  #    --only-binary=:all:, which reports sdist-only deps (e.g. metaphone in
  #    BSL) as missing and produces false failures. Matching the interpreter
  #    for real avoids that entirely.
  # ---------------------------------------------------------------------------
  deps-resolve:
    name: deps-resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve every production lock against Python 3.11
        run: |
          set -uo pipefail
          failed=0
          shopt -s nullglob
          for lock in */requirements-prod.lock.txt; do
            dir="$(dirname "$lock")"
            printf '::group::%s\n' "$dir"
            # --dry-run resolves without installing. The runner interpreter is
            # already 3.11 (set above), so Requires-Python is enforced for real
            # and sdist-only packages resolve normally.
            # --extra-index-url mirrors what every agent Dockerfile does before
            # installing the lock. Flico pins torch==2.13.0+cpu, and that "+cpu"
            # local version exists ONLY on the PyTorch CPU index, never on PyPI.
            # Without this the job reports a false failure for an agent whose
            # real image builds perfectly well.
            if pip install --dry-run --ignore-installed \
                 --extra-index-url https://download.pytorch.org/whl/cpu \
                 -r "$lock" > /tmp/out.txt 2>&1; then
              echo "OK — $dir resolves on Python 3.11"
            else
              echo "FAILED — $dir cannot be installed on Python 3.11:"
              grep -iE 'ERROR|conflict is caused|Requires-Python' /tmp/out.txt | head -20 || tail -20 /tmp/out.txt
              failed=1
            fi
            echo '::endgroup::'
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one production lock cannot be installed. A merge would leave main unbuildable for that agent."
            exit 1
          fi
          echo "All production locks resolve on Python 3.11."

# ============================================================================
# Deploy Gate — push → notify → you approve by comment → smart deploy
# ----------------------------------------------------------------------------
# Native GitHub "required reviewers" needs a paid plan on private repos, so this
# is a plan-independent approval gate:
#   1. Push to main touches an agent's folder  → this opens a "Deploy pending"
#      issue listing the changed agents + recommended mode (fast vs build).
#   2. YOU (repo owner) reply on that issue:  `/deploy <agent>`  (fast, default)
#      or  `/deploy <agent> build`  (rebuild image; use when deps/Dockerfile
#      changed). One agent per comment.
#   3. It verifies you are the owner, calls deploy.yml (the smart engine) for
#      that agent against main, and comments the health result.
# Nothing deploys without your comment. agents: bsl flico hatton slic sofia
# kavya kitchened wor
# ============================================================================

name: Deploy Gate

on:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  # ---- On push: open a deploy-request issue for changed agents --------------
  open-request:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect changed agents + recommend mode
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if git rev-parse --quiet --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            CHANGED=$(git diff --name-only "${AFTER}~1" "$AFTER" 2>/dev/null || true)
          fi
          lines=""
          for entry in "BSL Agent:bsl" "Flico Agent:flico" "HattonHills:hatton" "SLIC Agent:slic" "Sofia Agent:sofia" "Kavya:kavya" "Kitchened:kitchened" "WorldOfRefrigerators:wor"; do
            dir="${entry%%:*}"; id="${entry##*:}"
            match=$(printf '%s\n' "$CHANGED" | grep -F "$dir/" || true)
            [ -z "$match" ] && continue
            mode=fast
            printf '%s\n' "$match" | grep -qE 'requirements.*\.txt|Dockerfile|docker-compose\.ya?ml' && mode=build
            lines="${lines}- \`${id}\` — recommended **${mode}**"$'\n'
          done
          if [ -z "$lines" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          {
            echo "Push \`${AFTER:0:7}\` changed these agents:"
            echo
            printf '%s' "$lines"
            echo
            echo "**Approve to ship** — reply on this issue:"
            echo '- `/deploy <agent>` — fast (hot-swap code + restart, no rebuild)'
            echo '- `/deploy <agent> build` — full rebuild (use when deps/Dockerfile/compose changed)'
            echo
            echo "Deploys the current \`main\`. One agent per comment. Owner-only."
          } > body.md
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Open deploy-request issue
        if: ${{ steps.detect.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "🚀 Deploy pending @ ${GITHUB_SHA:0:7}" \
            --label deploy-request \
            --body-file body.md

  # ---- On comment: authorize + parse, then hand off to the engine ----------
  parse:
    if: >-
      ${{ github.event_name == 'issue_comment'
          && startsWith(github.event.comment.body, '/deploy')
          && github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.p.outputs.agent }}
      mode: ${{ steps.p.outputs.mode }}
      ok: ${{ steps.p.outputs.ok }}
    steps:
      - name: Parse `/deploy <agent> [mode]`
        id: p
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          line=$(printf '%s\n' "$BODY" | head -1)
          agent=$(echo "$line" | awk '{print $2}')
          mode=$(echo "$line" | awk '{print $3}'); mode=${mode:-fast}
          case "$agent" in bsl|flico|hatton|slic|sofia|kavya|kitchened|wor) ok=true ;; *) ok=false ;; esac
          case "$mode" in fast|build) ;; *) mode=fast ;; esac
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

  deploy:
    needs: parse
    if: ${{ needs.parse.outputs.ok == 'true' }}
    uses: ./.github/workflows/deploy.yml
    with:
      agent: ${{ needs.parse.outputs.agent }}
      ref: main
      mode: ${{ needs.parse.outputs.mode }}
    secrets: inherit

  ack:
    needs: [parse, deploy]
    if: ${{ always() && needs.parse.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" -R "${{ github.repository }}" \
            --body "Deploy of \`${{ needs.parse.outputs.agent }}\` (mode=${{ needs.parse.outputs.mode }}): **${{ needs.deploy.result }}**"

  reject:
    if: >-
      ${{ github.event_name == 'issue_comment'
          && startsWith(github.event.comment.body, '/deploy')
          && github.event.comment.author_association != 'OWNER' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" -R "${{ github.repository }}" \
            --body "⛔ Only the repo owner can trigger a deploy."

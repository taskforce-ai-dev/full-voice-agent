name: dep-audit

# Scans each agent's pinned Python dependencies for known CVEs using pip-audit.
#
# ADVISORY (non-blocking) for seven of the eight agents: their jobs use
# `continue-on-error: true`, so a vulnerable/yanked dependency surfaces in the
# logs and the job summary but does NOT fail the workflow. This keeps the
# pipeline green-able while their existing pinned deps are triaged.
#
# Kavya is ENFORCED: its lock file (requirements-prod.lock.txt — what the
# Dockerfile actually installs, not the loose requirements-prod.txt ranges)
# is audited with `--no-deps` and `continue-on-error` is off for that matrix
# entry, so a newly pinned or newly disclosed CVE in Kavya's real dependency
# set fails the build. To enforce another agent, drop its
# `continue-on-error` the same way (see the `audit` job below) once its
# existing pinned advisories are resolved.

on:
  # NOT on pull_request/push for the seven advisory agents. This job fans out
  # to 8 parallel jobs (one per agent) and seven of them are
  # `continue-on-error: true` — they have never blocked a merge and are not
  # meant to. Running the whole matrix per-PR cost ~664 billed Actions
  # minutes in the 2026-08 cycle: a third of the 2,000-minute allowance, spent
  # on advisory output nobody gates on.
  #
  # The cost is dominated by job COUNT, not runtime. Each of the 8 jobs takes
  # ~40 seconds but GitHub bills every job rounded UP to a whole minute, so
  # ~5 minutes of real work bills as 8.
  #
  # Weekly is the right cadence for advisory CVE scanning on the other seven
  # agents anyway: it catches newly disclosed CVEs against already-merged
  # pinned deps, which is exactly the case a per-PR run CANNOT catch. Use
  # workflow_dispatch for an on-demand check when changing dependencies.
  #
  # Kavya's `pull_request` trigger is scoped to its own requirements files
  # only, so it does not reintroduce the per-PR cost for the other seven
  # agents (their rows in the matrix still run, but only on this narrow
  # trigger, and only Kavya's row is blocking).
  #
  # If another agent is ever made blocking (drop its `continue-on-error`),
  # widen the `pull_request` `paths` filter below to include its
  # requirements files too — a required check that only runs weekly is worse
  # than no check.
  pull_request:
    paths:
      - 'Kavya/requirements*'
  workflow_dispatch:
  schedule:
    # Weekly, Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: dep-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pip-audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    # ADVISORY for every agent except Kavya: do not fail the workflow on
    # findings yet. Tighten another agent later by adding it to this
    # exclusion the same way, once its existing pinned advisories are
    # resolved.
    continue-on-error: ${{ matrix.dir != 'Kavya' }}
    strategy:
      # Audit every agent dir independently; one vulnerable agent does not
      # short-circuit the others.
      fail-fast: false
      matrix:
        # Folder names with spaces are passed as quoted JSON strings.
        dir:
          - "BSL Agent"
          - "Flico Agent"
          - "HattonHills"
          - "Kavya"
          - "Kitchened"
          - "SLIC Agent"
          - "Sofia Agent"
          - "WorldOfRefrigerators"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit pinned dependencies
        # Kavya: audit the exact lock file its Dockerfile installs
        # (requirements-prod.txt only pins loose ranges, so pip-audit
        # against it resolves the LATEST matching versions, not what
        # actually ships — see the High finding this fixes). `--no-deps`
        # keeps pip-audit from trying to resolve/build the pins itself; it
        # reads the lock file's exact versions directly.
        #
        # Every other agent: prefer requirements-prod.txt; fall back to
        # requirements.txt when the prod file is absent (e.g. some agents
        # ship only one of the two).
        run: |
          dir="${{ matrix.dir }}"

          if [ "$dir" = "Kavya" ]; then
            req="$dir/requirements-prod.lock.txt"
            if [ ! -f "$req" ]; then
              echo "::error::Kavya requires a pinned lock file at $req" >&2
              exit 1
            fi
            echo "Auditing (locked, no-deps): $req"
            pip-audit -r "$req" --no-deps
            exit $?
          fi

          prod="$dir/requirements-prod.txt"
          base="$dir/requirements.txt"

          if [ -f "$prod" ]; then
            req="$prod"
          elif [ -f "$base" ]; then
            req="$base"
          else
            echo "::warning::No requirements file found in '$dir' (looked for requirements-prod.txt and requirements.txt) — skipping."
            exit 0
          fi

          echo "Auditing: $req"
          pip-audit -r "$req"

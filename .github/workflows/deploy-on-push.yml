# ============================================================================
# Auto-Deploy on push to main
# ----------------------------------------------------------------------------
# Every push to main that changes an agent's folder is deployed to PRODUCTION
# automatically. For each changed agent it auto-chooses the mode:
#   • fast  — only code / knowledge-docs changed  → hot-swap + restart (seconds)
#   • build — requirements*.txt / Dockerfile / docker-compose.yml changed → rebuild
#
# THERE IS NO APPROVAL STEP. The human gate is the risk analysis + approval that
# happens with Claude/Codex BEFORE the change is pushed. A basic syntax check
# (py_compile of changed .py) blocks obviously-broken pushes from shipping.
#
# Deploys run through deploy.yml (the engine) via workflow_call. Only the agents
# that actually changed are deployed; tooling/docs pushes deploy nothing.
# ============================================================================

name: Auto-Deploy on Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  # A called reusable workflow cannot request MORE than its caller grants, and
  # deploy.yml needs packages:write to push the image to GHCR in `image` mode.
  # Without this the whole run dies with startup_failure before any step runs.
  packages: write

concurrency:
  group: auto-deploy-main
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      has: ${{ steps.d.outputs.has }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: d
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git rev-parse --quiet --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            CHANGED=$(git diff --name-only "${AFTER}~1" "$AFTER" 2>/dev/null || true)
          fi
          echo "Changed files:"; printf '%s\n' "$CHANGED"
          items=""
          for entry in "BSL Agent:bsl" "Flico Agent:flico" "HattonHills:hatton" "SLIC Agent:slic" "Sofia Agent:sofia" "Kavya:kavya" "Kitchened:kitchened" "WorldOfRefrigerators:wor"; do
            dir="${entry%%:*}"; id="${entry##*:}"
            match=$(printf '%s\n' "$CHANGED" | grep -F "$dir/" || true)
            [ -z "$match" ] && continue
            # Safety: syntax-check any changed Python before shipping it.
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # A renamed or deleted file still appears in CHANGED but is not
                # on disk. Compiling it aborted a deploy on 2026-07-30 with
                # "No such file or directory" after a test file was git mv'd.
                # Only syntax-check files that still exist.
                *.py) [ -f "$f" ] || continue
                      python3 -m py_compile "$f" || { echo "::error::Syntax error in $f — aborting deploy"; exit 1; } ;;
              esac
            done <<< "$match"
            mode=fast
            printf '%s\n' "$match" | grep -qE 'requirements.*\.txt|Dockerfile|docker-compose\.ya?ml' && mode=build
            # Registry-based agents never build on the VPS. Their compose pulls a
            # tagged image instead of declaring `build:`, so ANY change to them —
            # code included — means a new image, not a hot-swap. Detect that from
            # the compose file rather than keeping a second list in sync.
            if grep -qE '^[[:space:]]*image:[[:space:]]*ghcr\.io/' "$dir/docker-compose.yml" 2>/dev/null; then
              mode=image
            fi
            items="${items}{\"agent\":\"${id}\",\"mode\":\"${mode}\"},"
            echo "-> will deploy ${id} (${mode})"
          done
          items="${items%,}"
          if [ -z "$items" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "No agent folders changed — nothing to deploy."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[${items}]}" >> "$GITHUB_OUTPUT"
          fi

  # Hard gate on the Flico KB. The retrieval filter decides which properties a
  # caller is told about, so a regression here misinforms real people. The
  # exhaustive parser/filter sweeps and the prose<->truth-table cross-check need
  # only numpy+pydantic+pytest (no sentence-transformers), so this runs in well
  # under a minute and can gate every deploy. Pushing to main deploys straight to
  # production, so this MUST pass before the deploy job.
  kb-verify:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: touched
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git rev-parse --quiet --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            CHANGED=$(git diff --name-only "${AFTER}~1" "$AFTER" 2>/dev/null || true)
          fi
          if printf '%s\n' "$CHANGED" | grep -qF 'Flico Agent/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Flico Agent untouched — KB verification not required."
          fi
      - if: steps.touched.outputs.run == 'true'
        uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - if: steps.touched.outputs.run == 'true'
        run: pip install --quiet pytest numpy pydantic
      - if: steps.touched.outputs.run == 'true'
        working-directory: Flico Agent
        # `python -m pytest` (not bare pytest) so CWD is importable and the
        # tests/ oracle package resolves.
        run: python -m pytest tests/ -q

  deploy:
    needs: [detect, kb-verify]
    if: ${{ needs.detect.outputs.has == 'true' && needs.kb-verify.result == 'success' }}
    strategy:
      fail-fast: false
      # Deploys run ON the production VPS: `build` mode rebuilds the Docker
      # image there, competing for CPU/RAM/disk with the agents answering live
      # calls. On 2026-08-02 a batch touching all 8 agents fanned out at once;
      # the box was starved and the SSH sessions died mid-`exporting layers`
      # ("client_loop: send disconnect: Broken pipe", exit 255), failing 3 of
      # the 8 deploys. The agents stayed up — a build dies before the container
      # swap — but the failures masked a real dependency conflict in a fourth.
      # Two at a time keeps a batch survivable. Raise only after builds move
      # off the production host.
      max-parallel: 2
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/deploy.yml
    with:
      agent: ${{ matrix.agent }}
      ref: ${{ github.sha }}
      mode: ${{ matrix.mode }}
    secrets: inherit

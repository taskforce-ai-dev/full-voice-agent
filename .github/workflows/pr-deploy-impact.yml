# ============================================================================
# PR Deploy Impact — tell the reviewer what merging will ship
# ----------------------------------------------------------------------------
# Merging a PR to main deploys to PRODUCTION via deploy-on-push.yml. On the free
# plan nothing enforces review, so the reviewer's go/no-go IS the gate. This
# workflow makes that call an informed one: every PR gets a sticky comment
# naming the agents that will deploy on merge, the mode each will use, and
# whether calls get interrupted.
#
# The detection logic here MIRRORS deploy-on-push.yml (same agent map, same
# image/fast/build rule, same Flico KB gate). If you change the detection rules
# there, change them here too — a comment that under-reports the blast radius is
# worse than no comment at all.
#
# That is not hypothetical: when `image` mode was added (PR #105/#107) this file
# was not updated, so for six weeks it told reviewers every registry agent was a
# `fast` hot-swap — "seconds" — when merging actually triggered a full runner
# build and VPS pull. Under-reporting is the one failure this workflow exists to
# prevent, so treat the two files as a pair.
#
# ---------------------------------------------------------------------------
# WHY pull_request_target, AND WHY IT IS SAFE HERE
# ---------------------------------------------------------------------------
# Dependabot opens most of the PRs in this repo, and many of them bump an agent's
# requirements*.txt — which means a `build` deploy: full rebuild + restart of a
# live voice agent. Those are the PRs where this comment matters MOST.
#
# GitHub hands Dependabot-triggered `pull_request` runs a READ-ONLY token, so a
# `pull_request` workflow cannot post a comment on them (403). `pull_request_target`
# runs in the context of the base branch and gets a writable token, so it can.
#
# pull_request_target is normally dangerous because the usual pattern — check out
# the PR head and then build/test/execute it — runs untrusted code with a
# privileged token. THIS WORKFLOW NEVER CHECKS OUT PR CODE AT ALL. It reads the
# changed-file list from the REST API and does string matching on filenames. No
# actions/checkout, no dependency install, no script from the PR is executed.
#
# If you ever add `actions/checkout` to this file, you MUST move it back to
# `pull_request` or you will have created a repo-takeover vector.
#
# Permissions are the minimum needed to comment. No deploy, no VPS secrets.
# ============================================================================

name: PR Deploy Impact

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  # Needed to read each agent's docker-compose.yml through the contents API in
  # order to tell `image` agents from legacy `fast`/`build` ones. Declaring a
  # permissions block sets every UNLISTED scope to `none`, so omitting this does
  # not inherit read access — it denies it, the API call 404s, and the mode
  # detection silently degrades. That is exactly how this shipped broken once.
  # Read-only, and still no checkout: the compose file is text we grep, never
  # code we run.
  contents: read

concurrency:
  group: pr-deploy-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Changed files straight from the API — no checkout, no PR code on disk.
          CHANGED=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "Changed files:"; printf '%s\n' "$CHANGED"

          : > rows.md
          any=false
          build_any=false
          image_any=false
          unknown_any=false

          # Same agent map as deploy-on-push.yml. Folder names contain spaces —
          # keep them quoted and matched with grep -F.
          for entry in "BSL Agent:bsl" "Flico Agent:flico" "HattonHills:hatton" \
                       "SLIC Agent:slic" "Sofia Agent:sofia" "Kavya:kavya" \
                       "Kitchened:kitchened" "WorldOfRefrigerators:wor"; do
            dir="${entry%%:*}"; id="${entry##*:}"
            match=$(printf '%s\n' "$CHANGED" | grep -F "$dir/" || true)
            [ -z "$match" ] && continue

            any=true
            if [ "$id" = "kavya" ]; then
              count=$(printf '%s\n' "$match" | grep -c . || true)
              printf '| `%s` | `%s` | **excluded** | reviewed SmartPBX probe -> publisher -> runbook route; no generic deployment | %s |\n' \
                "$id" "$dir" "$count" >> rows.md
              echo "-> $id (excluded; reviewed SmartPBX probe -> publisher -> runbook route)"
              continue
            fi

            mode=fast
            effect='hot-swap changed `.py` + `docker restart` — seconds'
            if printf '%s\n' "$match" | grep -qE 'requirements.*\.txt|Dockerfile|docker-compose\.ya?ml'; then
              mode=build
              effect='full image rebuild + `compose up -d --build` — minutes'
              build_any=true
            fi

            # Registry agents override both. deploy-on-push.yml decides this by
            # grepping the agent's docker-compose.yml ON DISK — which this
            # workflow cannot do, because it deliberately never checks the PR out
            # (see the pull_request_target note at the top). Read the file through
            # the contents API instead: it is text we grep, never code we run, so
            # the no-checkout invariant still holds.
            #
            # Read at the PR HEAD, not the base, so a PR that CONVERTS an agent to
            # `image` reports the mode it will actually deploy with.
            enc="${dir// /%20}"
            compose=$(gh api "repos/$REPO/contents/$enc/docker-compose.yml?ref=$HEAD_SHA" \
                        -H 'Accept: application/vnd.github.raw' 2>&1) || compose=""

            if [ -z "$compose" ]; then
              # NEVER fall through to `fast` here. Defaulting to the least
              # alarming answer on failure is precisely how this workflow spent
              # weeks assuring reviewers that image deploys were seconds-long
              # hot-swaps. If the mode cannot be determined, say so loudly and
              # let the reviewer assume the worst.
              echo "::warning::could not read $dir/docker-compose.yml — deploy mode unknown"
              mode='⚠️ unknown'
              effect='**could not read `docker-compose.yml`** — assume a full rebuild'
              unknown_any=true
            elif printf '%s\n' "$compose" | grep -qE '^[[:space:]]*image:[[:space:]]*ghcr\.io/'; then
              mode=image
              effect='built on the runner, pushed to GHCR, VPS pulls + restarts — minutes'
              image_any=true
            fi

            count=$(printf '%s\n' "$match" | grep -c . || true)
            printf '| `%s` | `%s` | **%s** | %s | %s |\n' \
              "$id" "$dir" "$mode" "$effect" "$count" >> rows.md
            echo "-> $id ($mode)"
          done

          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "build_any=$build_any" >> "$GITHUB_OUTPUT"
          echo "image_any=$image_any" >> "$GITHUB_OUTPUT"
          echo "unknown_any=$unknown_any" >> "$GITHUB_OUTPUT"

          if printf '%s\n' "$CHANGED" | grep -qF 'Flico Agent/'; then
            echo "flico=true" >> "$GITHUB_OUTPUT"
          else
            echo "flico=false" >> "$GITHUB_OUTPUT"
          fi

      - id: body
        env:
          ANY: ${{ steps.detect.outputs.any }}
          BUILD_ANY: ${{ steps.detect.outputs.build_any }}
          IMAGE_ANY: ${{ steps.detect.outputs.image_any }}
          UNKNOWN_ANY: ${{ steps.detect.outputs.unknown_any }}
          FLICO: ${{ steps.detect.outputs.flico }}
        run: |
          set -euo pipefail
          {
            echo '<!-- deploy-impact -->'
            echo '## Deploy impact'
            echo
            if [ "$ANY" = "true" ]; then
              echo '> **Merging this PR deploys to production** (`67.207.90.109`).'
              echo '> The agents below restart, briefly interrupting any in-flight calls.'
              echo '> Merge during a quiet window.'
              echo
              echo '| Agent | Folder | Mode | Effect on merge | Files |'
              echo '|---|---|---|---|---|'
              cat rows.md
              echo
              if [ "$UNKNOWN_ANY" = "true" ]; then
                echo '> ⚠️ **This comment is not reliable.** The deploy mode for at least one'
                echo '> agent above could not be determined, so the blast radius shown may be'
                echo '> understated. Check `deploy-on-push.yml` by hand before merging, and'
                echo '> open an issue — this workflow is broken.'
                echo
              fi
              if [ "$BUILD_ANY" = "true" ] || [ "$IMAGE_ANY" = "true" ]; then
                echo '**Heads up:** at least one agent needs a full image build, so the'
                echo 'outage window is minutes rather than seconds. Dependency bumps land'
                echo 'here: a routine-looking version PR is a production rebuild.'
                echo
              fi
              if [ "$IMAGE_ANY" = "true" ]; then
                echo 'For `image` agents there is **no `fast` hot-swap path** — the container'
                echo 'runs a baked image, not code copied from disk, so *any* change (a `.md`'
                echo 'file included) means a new build. Nothing compiles on the VPS.'
                echo
              fi
            else
              echo 'No agent folders changed — **merging this PR deploys nothing.**'
              echo 'Tooling, CI and docs changes do not reach the VPS.'
              echo
            fi

            if [ "$FLICO" = "true" ]; then
              echo '`Flico Agent/` is touched, so the **KB verification gate** runs on merge'
              echo '(`pytest` over the retrieval filter). If it fails, no agent deploys.'
              echo
            fi

            echo '<details><summary>Rollback</summary>'
            echo
            echo '```bash'
            echo '# registry agents (all seven active ones) — pulls the exact image that ran'
            echo 'gh workflow run deploy.yml -f agent=<id> -f ref=<last-good-sha> -f mode=image'
            echo
            echo '# legacy fast/build path — Sofia Agent only'
            echo 'gh workflow run deploy.yml -f agent=sofia -f ref=<last-good-sha> -f mode=fast'
            echo '```'
            echo
            echo '</details>'
            echo
            echo '_Mirrors the detection in `deploy-on-push.yml`. See [CONTRIBUTING.md §6](../blob/main/CONTRIBUTING.md). Reporting only — this workflow never deploys._'
          } > comment.md
          cat comment.md

      - name: Post or update the sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- deploy-impact -->"))) | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@comment.md >/dev/null
            echo "Updated comment $existing"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -F body=@comment.md >/dev/null
            echo "Created new comment"
          fi

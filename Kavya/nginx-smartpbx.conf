# Dedicated TLS virtual host for the isolated Dialog SmartPBX profile.
# This top-level directive is valid because sites-enabled files are included in
# nginx's http context. Its unique zone name avoids Flico's existing zone.
limit_conn_zone $binary_remote_addr zone=kavya_smartpbx_per_ip:10m;

# Keep certificate renewal on the same hostname without exposing an application
# proxy on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name smartpbx-kavya.taskforceai.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartpbx-kavya.taskforceai.tech;

    ssl_certificate /etc/letsencrypt/live/smartpbx-kavya.taskforceai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpbx-kavya.taskforceai.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /var/log/nginx/smartpbx-kavya-error.log warn;
    server_tokens off;
    limit_conn kavya_smartpbx_per_ip 8;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Dialog media ingress: the application authenticates the dedicated
    # X-Kavya-SmartPBX-Token header before accepting the WebSocket.
    location = /ws/v1/smartpbx/media {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /smartpbx/status {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # No dashboard, Twilio, OpenAPI, or catch-all proxy surface on this host.
    location / { return 404; }
}

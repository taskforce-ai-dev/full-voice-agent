# Dedicated TLS virtual host for the isolated Dialog SmartPBX profile.
# This top-level directive is valid because sites-enabled files are included in
# nginx's http context. Its unique zone name avoids Flico's existing zone.
limit_conn_zone $binary_remote_addr zone=kavya_smartpbx_per_ip:10m;
# limit_conn bounds concurrency only. Without a request limit, unauthenticated
# connect/close cycling is free and floods the diagnostic log ring.
limit_req_zone $binary_remote_addr zone=kavya_smartpbx_req:10m rate=30r/m;
# The media socket zone above is sized for call volume, not the HTTP
# liveness/status endpoints. Without their own limit, an unauthenticated
# client can hammer them on the single uvicorn worker that also serves
# live audio.
limit_req_zone $binary_remote_addr zone=kavya_smartpbx_http:10m rate=60r/m;

# Minimal, privacy-safe access log format: method, path with the query string
# stripped (a token could ride in it), status, whether the connection
# upgraded (the media WebSocket), and request duration. No headers, no
# remote address beyond what nginx's error_log already carries, no body.
log_format smartpbx_min '$request_method $uri $status $http_upgrade $request_time';

# Keep certificate renewal on the same hostname without exposing an application
# proxy on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name smartpbx-kavya.taskforceai.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartpbx-kavya.taskforceai.tech;

    ssl_certificate /etc/letsencrypt/live/smartpbx-kavya.taskforceai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpbx-kavya.taskforceai.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # On, deliberately, with the minimal smartpbx_min format above (no query
    # string, no headers, no remote address) -- this vhost carries no guest
    # audio or PII in its request lines. A rate-limit rejection's source
    # address is still captured by error_log below (nginx logs "client: ..."
    # for limit_req/limit_conn denials at the `warn` level already set there).
    access_log /var/log/nginx/smartpbx-kavya-access.log smartpbx_min;
    error_log /var/log/nginx/smartpbx-kavya-error.log warn;
    limit_req_status 429;
    server_tokens off;
    limit_conn kavya_smartpbx_per_ip 8;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Dialog media ingress: the application authenticates the dedicated
    # X-Kavya-SmartPBX-Token header before accepting the WebSocket.
    location = /ws/v1/smartpbx/media {
        # Dialog opens one socket per call. The burst has to absorb a reconnect
        # storm after a container restart, when all active calls redial at once,
        # so it is set above the four-call cap rather than at it.
        limit_req zone=kavya_smartpbx_req burst=10 nodelay;
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        limit_req zone=kavya_smartpbx_http burst=20 nodelay;
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /smartpbx/status {
        limit_req zone=kavya_smartpbx_http burst=20 nodelay;
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # No dashboard, Twilio, OpenAPI, or catch-all proxy surface on this host.
    location / { return 404; }
}

# =============================================================================
# Nginx Configuration for BSL Voice Agent (Bank of Sri Lanka)
# Reverse proxy in front of Docker container on port 8002 (host)
#
# Deploy: copy to /etc/nginx/sites-available/bsl
#         ln -s /etc/nginx/sites-available/bsl /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
# =============================================================================

# ------------------------------------------------------------------------------
# Rate limiting zone — name must be unique across all server blocks on this VPS
# (Kavya/Sofia/SLIC each use their own zone name).
# ------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=bsl_webhook:10m rate=10r/s;

# ------------------------------------------------------------------------------
# HTTP server — redirect all traffic to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bsl.taskforceai.tech;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# HTTPS server — main server block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bsl.taskforceai.tech;

    # --------------------------------------------------------------------------
    # SSL certificates (managed by Certbot — issued during ./deploy.sh setup)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/bsl.taskforceai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bsl.taskforceai.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/bsl_access.log;
    error_log /var/log/nginx/bsl_error.log;

    # --------------------------------------------------------------------------
    # Client body size — keep small, we only receive JSON / form payloads
    # --------------------------------------------------------------------------
    client_max_body_size 1m;

    # --------------------------------------------------------------------------
    # Security headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --------------------------------------------------------------------------
    # WebSocket support (CRITICAL for Twilio ConversationRelay)
    # Twilio connects via WebSocket to /ws/conversation for real-time voice.
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket alive for long calls (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Twilio webhook endpoint — rate limited to prevent abuse
    # This is the single voice entrypoint for BSL (no IVR language menu).
    # --------------------------------------------------------------------------
    location /voice/incoming {
        limit_req zone=bsl_webhook burst=20 nodelay;

        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # All other HTTP traffic (e.g., /health) — proxied to the Docker container
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# REVIEW-ONLY template. Install only as a private, loopback-only origin.
log_format factory_console_audit '$time_iso8601 status=$status method=$request_method uri=$uri bytes=$body_bytes_sent duration=$request_time';

server {
    listen 127.0.0.1:8400 default_server;
    server_name _;

    server_tokens off;
    root /var/lib/factory-console/ui;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    access_log /var/log/nginx/factory-console-access.log factory_console_audit;
    error_log /var/log/nginx/factory-console-error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "no-store" always;

    if ($content_type ~* "multipart/form-data") { return 415; }

    location ~ ^/(?:api/)?(?:deploy|provision)(?:/|$) {
        return 404;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "factory_csrf=$cookie_factory_csrf";
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Dedicated TLS virtual host for the IAAC (Vidya) Dialog SmartPBX ingress.
# This top-level directive is valid because sites-enabled files are included
# in nginx's http context. Its unique zone names avoid every other agent's
# zones on this host (Kavya uses kavya_smartpbx_*, Hutch uses hutch_smartpbx_*)
# -- a duplicated limit_*_zone name is a fatal nginx config error, so these
# MUST stay distinct from any other vhost sharing this box.
limit_conn_zone $binary_remote_addr zone=iaac_smartpbx_per_ip:10m;
# limit_conn bounds concurrency only. Without a request limit, unauthenticated
# connect/close cycling is free and floods the diagnostic log ring.
limit_req_zone $binary_remote_addr zone=iaac_smartpbx_req:10m rate=30r/m;

# Keep certificate renewal on the same hostname without exposing an
# application proxy on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name smartpbx-iaac.taskforceai.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartpbx-iaac.taskforceai.tech;

    ssl_certificate /etc/letsencrypt/live/smartpbx-iaac.taskforceai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpbx-iaac.taskforceai.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # On, deliberately: a rejected connection must be attributable to a
    # source address. This vhost carries no caller audio or PII in its
    # request lines.
    access_log /var/log/nginx/smartpbx-iaac-access.log;
    error_log /var/log/nginx/smartpbx-iaac-error.log warn;
    limit_req_status 429;
    server_tokens off;
    limit_conn iaac_smartpbx_per_ip 8;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Dialog media ingress: the application authenticates the dedicated
    # X-IAAC-SmartPBX-Token header before accepting the WebSocket.
    location = /ws/v1/smartpbx/media {
        # Dialog opens one socket per call. The burst has to absorb a
        # reconnect storm after a container restart, when all active calls
        # redial at once, so it is set above the four-call cap rather than
        # at it.
        limit_req zone=iaac_smartpbx_req burst=10 nodelay;
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /smartpbx/status {
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # No dashboard, Twilio, OpenAPI, or catch-all proxy surface on this host.
    location / { return 404; }
}

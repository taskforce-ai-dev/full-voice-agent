# Temporary HTTP-only ACME bootstrap for smartpbx-iaac.taskforceai.tech.
# Used ONCE to obtain the Let's Encrypt cert via the HTTP-01 challenge before
# the TLS vhost (nginx-smartpbx.conf) exists -- that file references
# /etc/letsencrypt/live/smartpbx-iaac.taskforceai.tech/ and nginx will not
# start until the cert is present. Serve this on port 80, run certbot, then
# swap in nginx-smartpbx.conf. No application proxy is exposed here.
server {
    listen 80;
    listen [::]:80;
    server_name smartpbx-iaac.taskforceai.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}

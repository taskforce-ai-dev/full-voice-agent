# =============================================================================
# Nginx Configuration for Hatton Hills Voice Agent
# Reverse proxy in front of Docker container on port 8000
#
# Deploy: copy to /etc/nginx/sites-available/worldofrefrigerators
#         ln -s /etc/nginx/sites-available/worldofrefrigerators /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual domain (e.g., hattonhills.example.com)
# =============================================================================

# ------------------------------------------------------------------------------
# Rate limiting zone for Twilio webhook endpoint
# 10 requests/second with burst queue of 20 — handles concurrent inbound calls
# without dropping legitimate traffic
# ------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=twilio_webhook:10m rate=10r/s;

# ------------------------------------------------------------------------------
# HTTP server — redirect all traffic to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name worldofrefrigerators.taskforceai.tech;  # Replace YOUR_DOMAIN with your actual domain

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# HTTPS server — main server block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name worldofrefrigerators.taskforceai.tech;  # Replace YOUR_DOMAIN with your actual domain

    # --------------------------------------------------------------------------
    # SSL certificates (managed by Certbot)
    # Replace YOUR_DOMAIN with your actual domain
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/worldofrefrigerators.taskforceai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldofrefrigerators.taskforceai.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/worldofrefrigerators_access.log;
    error_log /var/log/nginx/worldofrefrigerators_error.log;

    # --------------------------------------------------------------------------
    # Client body size — keep small, we only receive JSON payloads
    # --------------------------------------------------------------------------
    client_max_body_size 1m;

    # --------------------------------------------------------------------------
    # Security headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --------------------------------------------------------------------------
    # WebSocket support (CRITICAL for Twilio ConversationRelay)
    #
    # Twilio connects via WebSocket to /ws/conversation for real-time voice
    # streaming. Without proper Upgrade headers and long timeouts, calls will
    # drop unexpectedly.
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket alive for long calls (24 hours)
        # Phone calls can last a long time — do not let nginx kill the connection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Twilio webhook endpoint — rate limited to prevent abuse
    # burst=20 allows short spikes (e.g., multiple simultaneous inbound calls)
    # nodelay processes burst requests immediately rather than queuing them
    # --------------------------------------------------------------------------
    location /voice/incoming {
        limit_req zone=twilio_webhook burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Twilio IVR language selection endpoint — same rate limiting as /voice/incoming
    # Called by Twilio after guest presses a DTMF digit to select language
    # --------------------------------------------------------------------------
    location /voice/language-selected {
        limit_req zone=twilio_webhook burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # All other HTTP traffic — proxied to the Docker container
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# REVIEW-ONLY CI fragment. It is static evidence, not a release workflow.
jobs:
  runtime-infrastructure-static:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact dependency pins
        run: test -f requirements-prod.lock.txt
      - name: Verify runtime import contract
        env:
          SMARTPBX_RUNTIME_MODE: synthetic
          SMARTPBX_ALLOW_SYNTHETIC_FOR_CI: "1"
          SMARTPBX_WS_TOKEN: build-check-token
          SMARTPBX_ACCOUNT_ID: build-check-account
          SMARTPBX_AUTH_HEADER_NAME: X-Build-Check-Token
          SMARTPBX_PRODUCT_PROFILE_PATH: config/product_profile.json
          SMARTPBX_KNOWLEDGE_DIR: knowledge_docs
          SMARTPBX_PROVIDER_PROFILE_PATH: config/provider_profile.json
        run: python -c "import startup"
      - name: Verify isolated website-demo import contract
        env:
          WEBSITE_DEMO_ENABLED: "true"
          WEBSITE_DEMO_AGENT_ID: generated-agent
          WEBSITE_DEMO_PUBLIC_BASE_URL: https://demo.example.invalid
          WEBSITE_DEMO_ALLOWED_ORIGIN: https://demo.example.invalid
          WEBSITE_DEMO_PRODUCT_PROFILE_PATH: config/product_profile.json
          WEBSITE_DEMO_PROVIDER_PROFILE_PATH: config/provider_profile.json
          WEBSITE_DEMO_KNOWLEDGE_DIR: knowledge_docs
          TWILIO_ACCOUNT_SID: build-account
          TWILIO_AUTH_TOKEN: build-token
          TWILIO_API_KEY_SID: build-key
          TWILIO_API_KEY_SECRET: build-secret
          TWILIO_TWIML_APP_SID: build-app
          SMARTPBX_RUNTIME_MODE: synthetic
          SMARTPBX_ALLOW_SYNTHETIC_FOR_CI: "1"
        run: python -c "import website_demo"

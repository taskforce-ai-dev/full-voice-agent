# REVIEW-ONLY website-demo proxy. The host configuration and TwiML App routing
# remain separately approved; this candidate never changes either one.
server {
    listen 443 ssl;
    server_name demo-canonical-ci-fixture.invalid;
    server_tokens off;

    ssl_certificate /run/secrets/canonical-ci-cert.pem;
    ssl_certificate_key /run/secrets/canonical-ci-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
        proxy_pass http://127.0.0.1:18999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/voice-token {
        proxy_pass http://127.0.0.1:18999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /voice/demo-incoming {
        proxy_pass http://127.0.0.1:18999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Twilio-Signature $http_x_twilio_signature;
    }

    location = /ws/website-demo/media {
        proxy_pass http://127.0.0.1:18999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}

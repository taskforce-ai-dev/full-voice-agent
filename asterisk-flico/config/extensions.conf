[general]
static = yes
writeprotect = no

[globals]

[flico-softphone]
exten => 7001,1,NoOp(Flico Asterisk SIP media pilot)
 same => n,Gosub(flico-language-ivr,s,1)
 same => n,Hangup()

exten => _X.,1,NoOp(Flico SIP DID ingress ${EXTEN})
 same => n,Gosub(flico-language-ivr,s,1)
 same => n,Hangup()

[flico-language-ivr]
exten => s,1,NoOp(Flico language IVR)
 same => n,Answer()
 same => n,Read(FLICO_LANG_CHOICE,custom/flico-language-menu,1,,3,8)
 same => n,GotoIf($["${FLICO_LANG_CHOICE}" = "1"]?en,1)
 same => n,GotoIf($["${FLICO_LANG_CHOICE}" = "2"]?ta,1)
 same => n,GotoIf($["${FLICO_LANG_CHOICE}" = "3"]?si,1)
 same => n,Playback(pbx-invalid)
 same => n,Goto(s,2)

exten => en,1,NoOp(Flico language selected: English)
 same => n,Stasis(flico-sip-agent,en)
 same => n,Return()

exten => ta,1,NoOp(Flico language selected: Tamil)
 same => n,Stasis(flico-sip-agent,ta)
 same => n,Return()

exten => si,1,NoOp(Flico language selected: Sinhala)
 same => n,Stasis(flico-sip-agent,si)
 same => n,Return()

exten => i,1,Playback(pbx-invalid)
 same => n,Goto(s,2)

exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()

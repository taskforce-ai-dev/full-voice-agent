[global]
type = global
endpoint_identifier_order = username,ip,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Set these to the VPS public IP when testing from an internet softphone.
external_signaling_address = 67.207.90.109
external_media_address = 67.207.90.109
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16

[1001]
type = auth
auth_type = userpass
username = 1001
password = CHANGE_ME_SOFTPHONE_SECRET

[1001]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

[1001]
type = endpoint
transport = transport-udp
context = flico-softphone
disallow = all
allow = ulaw
auth = 1001
aors = 1001
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

; Carrier/customer PBX trunk template for production.
; Copy this block, replace match/auth/aor values, and route to flico-softphone.
; [flico-trunk]
; type = endpoint
; transport = transport-udp
; context = flico-softphone
; disallow = all
; allow = ulaw
; direct_media = no
; rtp_symmetric = yes
; force_rport = yes
; rewrite_contact = yes
; dtmf_mode = rfc4733
; identify_by = ip
;
; [flico-trunk-identify]
; type = identify
; endpoint = flico-trunk
; match = PROVIDER_OR_PBX_IP
